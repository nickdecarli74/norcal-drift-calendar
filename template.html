<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftWest Weekend Schedule</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0b0b0c;
            --text-white: #ffffff;
            --text-grey: #808388;
            --red-accent: #d3202a;
            --border-dark: #1e1f22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            width: 1080px;
            height: 1350px; /* Instagram 4:5 Aspect Ratio */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Outer Frame Container */
        .graphic-container {
            display: grid;
            grid-template-columns: 410px 1fr;
            width: 100%;
            height: 100%;
            padding: 60px 60px;
            position: relative;
            z-index: 2;
        }

        /* Central Vertical Divider Line */
        .graphic-container::before {
            content: "";
            position: absolute;
            top: 60px;
            bottom: 60px;
            left: 430px;
            width: 1px;
            background-color: var(--border-dark);
        }

        /* --- LEFT COLUMN --- */
        .col-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 25px;
            height: 100%;
        }

        /* Top Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 10px;
            line-height: 1;
        }

        .brand-logo .white { color: var(--text-white); }
        .brand-logo .red { color: var(--red-accent); }

        .brand-line {
            width: 48px;
            height: 3px;
            background-color: var(--red-accent);
        }

        /* Vertically Stretched Headline */
        .title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 116px;
            line-height: 0.80;
            letter-spacing: 0px;
            transform: scaleY(1.30);
            transform-origin: top left;
            margin-top: 25px;
            margin-bottom: auto;
            padding-top: 25px;
        }

        .title-main .red {
            color: var(--red-accent);
        }

        /* Left Footer Block */
        .left-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-line {
            width: 60px;
            height: 2px;
            background-color: var(--red-accent);
        }

        .footer-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-text .sub {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-grey);
            letter-spacing: 2px;
        }

        .footer-text .url {
            font-size: 15px;
            font-weight: 700;
            color: var(--red-accent);
            letter-spacing: 2px;
        }

        /* --- RIGHT COLUMN (Dynamic Vertical Auto-Spacing) --- */
        .col-right {
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        /* Date Group Section */
        .date-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: space-between;
        }

        .date-header {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-white);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .date-header-line {
            flex: 1;
            height: 2px;
            background-color: var(--red-accent);
        }

        /* Event Row Item */
        .event-card {
            display: grid;
            grid-template-columns: 65px 1fr;
            gap: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-dark);
            align-items: flex-start;
        }

        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.9;
        }

        .date-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 68px;
            color: var(--red-accent);
            letter-spacing: 1px;
        }

        .date-day {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-grey);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .event-details {
            display: flex;
            flex-direction: column;
            padding-top: 4px;
        }

        .event-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            color: var(--text-white);
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .event-dash {
            width: 16px;
            height: 2px;
            background-color: var(--red-accent);
            margin: 5px 0 6px 0;
        }

        .event-venue {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-grey);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <div class="graphic-container">
        <!-- LEFT BRAND COLUMN -->
        <div class="col-left">
            <div class="brand-header">
                <div class="brand-logo"><span class="white">DRIFT</span><span class="red">WEST</span></div>
                <div class="brand-line"></div>
            </div>

            <div class="title-main">
                DRIFT<br>
                EVENTS<br>
                <span class="red">THIS</span><br>
                WEEKEND
            </div>

            <div class="left-footer">
                <div class="footer-line"></div>
                <div class="footer-text">
                    <div class="sub">EVENT REGISTRATION & MEDIA</div>
                    <div class="url">DRIFTWEST.NET</div>
                </div>
            </div>
        </div>

        <!-- RIGHT EVENTS COLUMN -->
        <div class="col-right">
            <!-- EVENTS_PLACEHOLDER -->
        </div>
    </div>

</body>
</html>
