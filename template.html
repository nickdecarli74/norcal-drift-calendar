<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap');
  body {
    width: 1080px; height: 1620px; margin: 0; background: #0A0A0A;
    font-family: 'Oswald', sans-serif; color: #E1E1E1; display: flex; box-sizing: border-box;
  }
  .left-col { width: 35%; border-right: 1px solid #1A1A1A; padding: 60px 40px; }
  .right-col { width: 65%; padding: 60px 40px; }
  .title-stack { font-family: 'Bebas Neue'; font-size: 130px; line-height: 0.9; text-transform: uppercase; }
  .red { color: #D01C1C; }
  .sub-text { color: #8A8A8A; font-size: 20px; }
  .event-card { margin-bottom: 30px; display: flex; gap: 20px; align-items: flex-start; }
  .date-num { font-size: 50px; color: #D01C1C; font-weight: bold; line-height: 1; text-align: center; min-width: 60px; }
  .accent-line { width: 25px; height: 2px; background: #D01C1C; margin: 6px 0; }
</style>
</head>
<body>
  <div class="left-col">
    <div style="letter-spacing: 6px; font-weight: bold;">DRIFT <span class="red">WEST</span></div>
    <div class="title-stack" style="margin-top: 120px;">
      DRIFT<br>EVENTS<br><span class="red">THIS</span><br>WEEKEND
    </div>
  </div>
  <div class="right-col">
    <!-- EVENTS_PLACEHOLDER -->
  </div>
</body>
</html>
