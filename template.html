<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftWest Weekend Schedule</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0b0b0c;
            --text-white: #ffffff;
            --text-grey: #808388;
            --red-accent: #d3202a;
            --border-dark: #1e1f22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            width: 1080px;
            height: 1620px;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Outer Frame Container */
        .graphic-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            width: 100%;
            height: 100%;
            padding: 90px 80px;
            position: relative;
            z-index: 2;
        }

        /* Central Vertical Divider Line */
        .graphic-container::before {
            content: "";
            position: absolute;
            top: 90px;
            bottom: 90px;
            left: 420px;
            width: 1px;
            background-color: var(--border-dark);
        }

        /* --- LEFT COLUMN --- */
        .col-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 40px;
            height: 100%;
        }

        /* Top Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 12px;
            line-height: 1;
        }

        .brand-logo .white { color: var(--text-white); }
        .brand-logo .red { color: var(--red-accent); }

        .brand-line {
            width: 55px;
            height: 3px;
            background-color: var(--red-accent);
        }

        /* Big Headline Block */
        .title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 155px;
            line-height: 0.88;
            letter-spacing: 2px;
            margin-top: 40px;
            margin-bottom: auto;
            padding-top: 60px;
        }

        .title-main .red {
            color: var(--red-accent);
        }

        /* Left Footer Block */
        .left-footer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .footer-line {
            width: 70px;
            height: 2px;
            background-color: var(--red-accent);
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .dw-box {
            width: 54px;
            height: 54px;
            border: 2px solid var(--red-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 34px;
            color: var(--red-accent);
            letter-spacing: 1px;
            font-style: italic;
        }

        .footer-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-text .sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-grey);
            letter-spacing: 2px;
        }

        .footer-text .url {
            font-size: 16px;
            font-weight: 700;
            color: var(--red-accent);
            letter-spacing: 2px;
        }

        /* --- RIGHT COLUMN --- */
        .col-right {
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-top: 70px;
        }

        /* Date Group Section */
        .date-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .date-header {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-white);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .date-header-line {
            flex: 1;
            height: 2px;
            background-color: var(--red-accent);
        }

        /* Event Row Item */
        .event-card {
            display: grid;
            grid-template-columns: 75px 1fr;
            gap: 24px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border-dark);
            align-items: flex-start;
        }

        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.9;
        }

        .date-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 82px;
            color: var(--red-accent);
            letter-spacing: 1px;
        }

        .date-day {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-grey);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .event-details {
            display: flex;
            flex-direction: column;
            padding-top: 8px;
        }

        .event-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 34px;
            color: var(--text-white);
            letter-spacing: 2px;
            line-height: 1;
        }

        .event-dash {
            width: 18px;
            height: 2px;
            background-color: var(--red-accent);
            margin: 8px 0 10px 0;
        }

        .event-venue {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-grey);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        /* Bottom Right Decorative Lines */
        .accent-lines {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 260px;
            height: 260px;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="graphic-container">
        <!-- LEFT BRAND COLUMN -->
        <div class="col-left">
            <div class="brand-header">
                <div class="brand-logo"><span class="white">DRIFT</span><span class="red">WEST</span></div>
                <div class="brand-line"></div>
            </div>

            <div class="title-main">
                DRIFT<br>
                EVENTS<br>
                <span class="red">THIS</span><br>
                WEEKEND
            </div>

            <div class="left-footer">
                <div class="footer-line"></div>
                <div class="footer-brand">
                    <div class="dw-box">DW</div>
                    <div class="footer-text">
                        <div class="sub">EVENT REGISTRATION & MEDIA</div>
                        <div class="url">DRIFTWEST.NET</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT EVENTS COLUMN -->
        <div class="col-right">
            <!-- EVENTS_PLACEHOLDER -->
        </div>
    </div>

    <!-- BOTTOM RIGHT ACCENT LINES SVG -->
    <svg class="accent-lines" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="120" y1="200" x2="200" y2="120" stroke="#d3202a" stroke-width="2"/>
        <line x1="140" y1="200" x2="200" y2="140" stroke="#d3202a" stroke-width="2"/>
        <line x1="160" y1="200" x2="200" y2="160" stroke="#d3202a" stroke-width="2"/>
        <polygon points="175,170 178,175 183,175 179,178 181,183 175,180 169,183 171,178 167,175 172,175" fill="#808388"/>
    </svg>

</body>
</html>
